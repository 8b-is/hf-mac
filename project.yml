# XcodeGen spec for hf.app.
#
# The .xcodeproj is GENERATED from this file and git-ignored (see .gitignore).
# This YAML is the single source of truth — never hand-edit the project in Xcode
# and expect it to persist; edit here and regenerate:
#
#     brew install xcodegen   # once
#     xcodegen generate       # writes HFMac.xcodeproj
#
# Xcode Cloud regenerates it automatically in ci_scripts/ci_post_clone.sh.
#
# The SwiftPM Package.swift stays the source of truth for the Developer-ID DMG /
# OSS build (`swift build`, release.yml). This Xcode target wraps the SAME
# Sources/HFMac for the Mac App Store / TestFlight path via Xcode Cloud, which
# wants a real .xcodeproj + shared scheme.

name: HFMac

options:
  bundleIdPrefix: dev.peterl
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    MARKETING_VERSION: "0.5.0"      # CFBundleShortVersionString (kept == Info.plist)
    CURRENT_PROJECT_VERSION: "1"    # CFBundleVersion / build number
    SWIFT_VERSION: "6.0"            # Swift 6 language mode (matches Package.swift tools 6.0)
    DEVELOPMENT_LANGUAGE: en
    # DEVELOPMENT_TEAM is intentionally unset: Xcode Cloud injects the team from
    # the App Store Connect integration; for a local signed build, pass it on the
    # xcodebuild command line or set it in Xcode's Signing & Capabilities.

targets:
  HFMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/HFMac
    settings:
      base:
        PRODUCT_NAME: HFMac                              # → HFMac.app (display name "hf.app" comes from Info.plist)
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterl.hfmac
        INFOPLIST_FILE: Packaging/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"                    # use our checked-in Info.plist verbatim
        CODE_SIGN_ENTITLEMENTS: Packaging/hf-mac.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""           # no asset catalog yet; avoids a build warning

# Shared scheme "HFMac" — this exact name is what Xcode Cloud's workflow and
# `xcodebuild -scheme HFMac` reference. Top-level schemes are written shared.
schemes:
  HFMac:
    build:
      targets:
        HFMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
