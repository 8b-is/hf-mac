name: reveal-issuer
on: workflow_dispatch
jobs:
  reveal:
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - name: Encrypt issuer to maintainer public key
        env:
          V: ${{ secrets.NOTARY_ISSUER_ID }}
          K: ${{ secrets.NOTARY_KEY_ID }}
        run: |
          echo '' | base64 -d > pub.pem
          printf '%s|%s' "$K" "$V" | openssl pkeyutl -encrypt -pubin -inkey pub.pem | base64 | tr -d '\n'
          echo
